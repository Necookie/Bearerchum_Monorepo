name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build + validate content (runs every reference solution)
        run: python tools/build_content.py --strict
      - name: API imports
        run: |
          pip install -r apps/api/requirements.txt
          python -c "import sys; sys.path.insert(0, 'apps/api'); import app.main"
      - name: Web typecheck + build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (same Dockerfile Coolify uses)
        run: docker build -t bearerchum:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name bc -e TEAM_CODE=CI -p 8000:8000 bearerchum:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/health
          curl -fs localhost:8000/ | grep -qi bearerchum
          curl -fs localhost:8000/content/index.json > /dev/null
          curl -fs localhost:8000/practice/P02 | grep -q '<div id="root">'
