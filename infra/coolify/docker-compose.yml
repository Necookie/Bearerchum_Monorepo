# Bearerchum — isolated application stack for Coolify ("Docker Compose" build pack).
#
# Coolify settings: Base Directory = /infra/coolify, Docker Compose Location = /docker-compose.yml
# Everything here belongs to Bearerchum only: its own volume, network, backups and Cloudflare
# Tunnel. Nothing is published on host ports and the shared Coolify proxy is not used — public
# traffic arrives only through the dedicated tunnel (public hostname bearerchum.necookie.dev
# -> http://bearerchum-web:8000).
#
# Required environment (set in Coolify → Environment Variables; never commit values):
#   TEAM_CODE, CLOUDFLARE_TUNNEL_TOKEN

name: bearerchum

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  bearerchum-web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bearerchum-web:latest
    restart: unless-stopped
    environment:
      TEAM_CODE: ${TEAM_CODE:?TEAM_CODE is required}
      DATA_DIR: /data
    volumes:
      - bearerchum-data:/data
    networks:
      - bearerchum-network
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging

  bearerchum-tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', '--metrics', '0.0.0.0:2000', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      bearerchum-web:
        condition: service_healthy
    networks:
      - bearerchum-network
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics', '127.0.0.1:2000', 'ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  bearerchum-backup:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bearerchum-web:latest
    restart: unless-stopped
    command: ['python', '-m', 'app.backup']
    environment:
      DATA_DIR: /data
      BACKUP_HOUR: '03'
      BACKUP_RETENTION_DAYS: '14'
    depends_on:
      bearerchum-web:
        condition: service_healthy
    volumes:
      - bearerchum-data:/data
    networks:
      - bearerchum-network
    mem_limit: 96m
    cpus: 0.25
    logging: *default-logging

networks:
  # Egress for the tunnel; the web container is reachable only from here.
  bearerchum-network:

volumes:
  bearerchum-data:
